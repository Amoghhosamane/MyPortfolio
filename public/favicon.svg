<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Modern Geometric Monogram 'A' with Integrated Neural Node / System Pivot -->
  <!-- Left leg -->
  <path d="M19 46 L32 15 L35 15" stroke="url(#blueGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  
  <!-- Right leg -->
  <path d="M32 15 L45 46" stroke="#93C5FD" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Sleek tech crossbar with gradient -->
  <path d="M23.5 35 L40.5 35" stroke="url(#blueGlow)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Glowing AI Node Accent at apex -->
  <circle cx="32" cy="15" r="3" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="32" cy="15" r="1.5" fill="#FFFFFF" />
</svg>
